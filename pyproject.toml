[project]
name = "my_deep_research"
version = "0.0.1"
description = "从零复现的深度研究Agent"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.5.4",
    "langchain-community>=0.3.9",
    "langchain-deepseek>=0.1.2",
    "langchain-openai>=0.3.28",
    "langchain-tavily",
    "tavily-python>=0.5.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.24.0",
]

[build-system]
requires = ["setuptools>=73.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["my_deep_research"]

[tool.setuptools.package-dir]
"my_deep_research" = "src/my_deep_research"

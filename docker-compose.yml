version: "3.8"

# ============================================
# 使用方式：
#   CPU：docker compose up --build
#   GPU：docker compose --profile gpu up --build
# ============================================

# 共享配置（避免重复）
x-common: &common
  ports:
    - "8000:8000"
  env_file:
    - .env
  volumes:
    - ./knowledge_base:/app/knowledge_base
    - ./chroma_db:/app/chroma_db
  restart: unless-stopped

services:
  # ---- CPU 版本（默认）----
  deep-research:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-deep-research-cpu

  # ---- GPU 版本 ----
  deep-research-gpu:
    <<: *common
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: my-deep-research-gpu
    profiles: ["gpu"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
